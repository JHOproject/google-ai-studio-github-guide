name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify required files and image links
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s index.html
          test -f .nojekyll

          mapfile -t image_paths < <(
            grep -Eho 'media/[A-Za-z0-9._/-]+' README.md index.html | sort -u
          )

          if (( ${#image_paths[@]} == 0 )); then
            echo "No media image references were found."
            exit 1
          fi

          for image_path in "${image_paths[@]}"; do
            if [[ ! -f "$image_path" ]]; then
              echo "Missing image: $image_path"
              exit 1
            fi
          done

          grep -Eq '^# .+' README.md
          grep -Eiq '<h1[^>]*>.+</h1>' index.html

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Prepare site artifact
        shell: bash
        run: |
          mkdir _site
          cp index.html README.md .nojekyll _site/
          cp -R media _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
